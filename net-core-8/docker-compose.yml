services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fi@Entrevista2026"
    ports:
      - "127.0.0.1:1433:1433"
    # O SQL Server 2022 atualiza a versão do .mdf ao anexá-lo, e o LocalDB do Windows não abre mais esse arquivo.
    # Por isso o original é só lido (somente leitura) e o Docker trabalha numa cópia dentro de um volume.
    volumes:
      - ./src/FI.AtividadeEntrevista.Web/App_Data:/origem:ro
      - dados:/dados
    command: >
      bash -c "mkdir -p /dados && ([ -f /dados/BancoDeDados.mdf ] || cp /origem/BancoDeDados.mdf /origem/BancoDeDados_log.ldf /dados/)
      && chown -R mssql /dados && exec /opt/mssql/bin/sqlservr"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  anexar-banco:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    command: >
      /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P Fi@Entrevista2026
      -Q "IF DB_ID('BancoDeDados') IS NULL CREATE DATABASE BancoDeDados ON (FILENAME = '/dados/BancoDeDados.mdf'), (FILENAME = '/dados/BancoDeDados_log.ldf') FOR ATTACH"

volumes:
  dados:
